# ============================================================
# YinwuForge 材料定义文件
# 材料通过 MythicMobs 插件发放，本文件仅用于匹配物品识别
# 匹配规则: 物品类型(material) + 自定义名称(name)
# ============================================================
#
# category 分类说明:
#   mineral  - 强化盔甲属性（放入槽2）
#   undead   - 强化武器属性（放入槽2）
#   farming  - 强化工具属性（放入槽2）
#   nether   - 提高成功率+15%，损坏率+5%（放入槽3，可选）
#   end      - 降低损坏率-8%，成功率-10%（放入槽3，可选）
#   challenge- 锻造等级≥5时损坏率-15%（放入槽3，可选）
#

